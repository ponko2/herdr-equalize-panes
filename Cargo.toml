[package]
name = "equalize-panes"
version = "0.2.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
env_logger = { version = "0.11.11", default-features = false }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "warn"
