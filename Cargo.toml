[package]
name = "equalize-panes"
version = "0.2.7"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
env_logger = { version = "0.11.12", default-features = false }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "warn"
