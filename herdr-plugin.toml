id = "ponko2.equalize-panes"
name = "Equalize Panes"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Keep panes the same size as the layout changes"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "equalize"
title = "Equalize panes"
description = "Make every pane in the focused tab the same size"
contexts = ["tab"]
command = ["./target/release/equalize-panes"]

[[events]]
on = "pane.created"
command = ["./target/release/equalize-panes"]

[[events]]
on = "pane.closed"
command = ["./target/release/equalize-panes"]

[[events]]
on = "pane.moved"
command = ["./target/release/equalize-panes"]

[[events]]
on = "pane.exited"
command = ["./target/release/equalize-panes"]
