id = "ponko2.equalize-panes"
name = "Equalize Panes"
version = "0.2.2" # x-release-please-version
min_herdr_version = "0.8.2"
description = "Keep panes the same size as the layout changes"
platforms = ["linux", "macos"]

[[build]]
command = ["./install.sh"]

[[actions]]
id = "equalize"
title = "Equalize panes"
description = "Make every pane in the focused tab the same size"
contexts = ["tab"]
command = ["./bin/equalize-panes"]

[[events]]
on = "pane.created"
command = ["./bin/equalize-panes"]

[[events]]
on = "pane.closed"
command = ["./bin/equalize-panes"]

[[events]]
on = "pane.moved"
command = ["./bin/equalize-panes"]

[[events]]
on = "pane.exited"
command = ["./bin/equalize-panes"]
