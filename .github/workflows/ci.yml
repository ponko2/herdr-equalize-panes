name: CI
on:
  merge_group: {}
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  required:
    name: "Required Checks: CI"
    if: ${{ always() }}
    needs:
      - changed-files
      - jactionlint
      - build
      - clippy
      - commitlint
      - deadnix
      - editorconfig
      - nixfmt
      - oxfmt
      - rustfmt
      - ryl
      - shear
      - statix
      - test
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Fail if any required jobs failed or cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
        shell: bash
  changed-files:
    name: Get changed files
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      # reference: https://github.com/tj-actions/changed-files#outputs-
      jactionlint: ${{ steps.changed-files.outputs.jactionlint_any_modified == 'true' }}
      nix: ${{ steps.changed-files.outputs.nix_any_modified == 'true' }}
      rust: ${{ steps.changed-files.outputs.rust_any_modified == 'true' }}
      ryl: ${{ steps.changed-files.outputs.ryl_any_modified == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 50 # Assume PRs are less than 50 commits
          persist-credentials: true
      - name: Get relevant files changed per group
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          files_yaml: |
            common: &common
              - .github/workflows/ci.yml
            dependencies: &dependencies
              - flake.lock
              - flake.nix
              - mise.lock
              - mise.toml
            jactionlint:
              - *dependencies
              - "**/action.{yaml,yml}"
              - ".github/workflows/*.{yaml,yml}"
              - .github/jactionlint.yaml
            nix:
              - *common
              - *dependencies
              - "**/*.nix"
            rust:
              - *common
              - *dependencies
              - "**/*.rs"
              - "**/Cargo.toml"
              - Cargo.lock
              - rust-toolchain.toml
            ryl:
              - *common
              - *dependencies
              - "**/*.{yaml,yml}"
              - .ryl.toml
  jactionlint:
    name: jactionlint
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.jactionlint == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
      - name: Run jactionlint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JACTIONLINT_ONLINE: 1
        run: jactionlint --format=github --color --strict-exit
        shell: bash
  build:
    name: Build
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.rust == 'true') }}
    needs: changed-files
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ponko2/actions/setup-nix@v1.8.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up mr boxington
        uses: jdx/mr-boxington-action@v1.7.3
      - name: Run Build
        env:
          TARGET: ${{ matrix.target }}
        run: nix develop --command mbx build --locked --target "$TARGET"
        shell: bash
  clippy:
    name: Clippy
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.rust == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ponko2/actions/setup-nix@v1.8.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up mr boxington
        uses: jdx/mr-boxington-action@v1.7.3
      - name: Run Clippy
        run: nix develop --command mbx clippy -- -D warnings
        shell: bash
  commitlint:
    name: commitlint
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 50 # Assume PRs are less than 50 commits
          filter: blob:none
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
      - name: Validate all commits from PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        shell: bash
  deadnix:
    name: deadnix
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.nix == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ponko2/actions/setup-nix@v1.8.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          prefetch-dependencies: false
      - name: Run deadnix
        run: nix --quiet run .#deadnix
        shell: bash
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
      - name: Run EditorConfig checker
        run: editorconfig-checker
        shell: bash
  nixfmt:
    name: Nixfmt
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.nix == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ponko2/actions/setup-nix@v1.8.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          prefetch-dependencies: false
      - name: Run Nixfmt
        run: nix fmt -- --ci
        shell: bash
  oxfmt:
    name: Oxfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
      - name: Run Oxfmt
        run: oxfmt --check
        shell: bash
  rustfmt:
    name: rustfmt
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.rust == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ponko2/actions/setup-nix@v1.8.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up mr boxington
        uses: jdx/mr-boxington-action@v1.7.3
      - name: Run rustfmt
        run: nix develop --command mbx fmt --check
        shell: bash
  ryl:
    name: ryl
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.ryl == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
      - name: Run ryl
        run: ryl --format=github --strict .
        shell: bash
      - name: Run ryl format
        run: ryl format --check --output-format=github .
        shell: bash
  shear:
    name: Shear
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.rust == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ponko2/actions/setup-nix@v1.8.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up mr boxington
        uses: jdx/mr-boxington-action@v1.7.3
      - name: Run Shear
        run: nix develop --command mbx shear --deny-warnings
        shell: bash
  statix:
    name: statix
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.nix == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ponko2/actions/setup-nix@v1.8.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          prefetch-dependencies: false
      - name: Run statix
        run: nix --quiet run .#statix -- check
        shell: bash
  test:
    name: Test
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.rust == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ponko2/actions/setup-nix@v1.8.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up mr boxington
        uses: jdx/mr-boxington-action@v1.7.3
      - name: Run Test
        run: nix develop --command mbx nextest run --locked --no-tests=warn
        shell: bash
